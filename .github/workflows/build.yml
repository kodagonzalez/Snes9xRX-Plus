name: Build Wii

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with devkitPPC Docker image
        run: |
          # Patch Makefile.wii to use bundled devkitPPC freetype include/libs and add extra libs
          sed -i 's/`freetype-config --cflags`/-I\/opt\/devkitpro\/portlibs\/ppc\/include\/freetype2/' Makefile.wii
          sed -i 's/`freetype-config --libs`/-lfreetype/' Makefile.wii
          sed -i 's/-ldi -liso9660 -lpng -lmxml -lfreetype/-ldi -liso9660 -lpng -lmxml -lfreetype -lbz2 -lbrotlidec -lbrotlicommon/' Makefile.wii

          docker run --rm -v "$PWD":/project devkitpro/devkitppc bash -lc '
            cd /project && 
            bashexport BINFILES="$(cd /project && ls source/lang/*.lang source/fonts/*.ttf source/images/*.png source/sounds/*.ogg 2>/dev/null | xargs -I{} basename {})" && echo "BINFILES=$BINFILES" && 
            make wii BINFILES="$BINFILES"
          '

      - name: Upload Wii binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: snes9xrx-wii-dol
          path: executables/snes9xrx-wii.dol
